<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floorplan Collector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0f11;
      --surface:   #16181c;
      --border:    #2a2d35;
      --accent:    #e8ff47;
      --accent2:   #47c2ff;
      --text:      #f0f0ef;
      --muted:     #6b7280;
      --danger:    #ff5f5f;
      --radius:    8px;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }
    body {
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      margin: 0;
    }

    /* ── Header ── */
    .header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: var(--accent);
      border-radius: 6px;
      display: grid;
      place-items: center;
    }
    .logo-icon svg { width: 18px; height: 18px; }
    .logo-text { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
    .logo-text span { color: var(--accent); }
    .count-badge {
      background: var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 20px;
    }
    .count-badge.has-items { background: var(--accent); color: #000; font-weight: 500; }

    /* ── Capture zone ── */
    .capture-zone {
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--border);
    }
    .btn-capture {
      width: 100%;
      padding: 11px 16px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-capture:hover { opacity: 0.88; }
    .btn-capture:active { transform: scale(0.98); }
    .btn-capture:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-capture svg { width: 15px; height: 15px; flex-shrink: 0; }

    /* ── Status bar ── */
    .status-bar {
      margin: 10px 18px 0;
      font-size: 11.5px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      min-height: 18px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .status-bar.success { color: var(--accent); }
    .status-bar.error   { color: var(--danger); }
    .status-bar a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .status-bar a:hover { opacity: 0.8; }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ── List header ── */
    .list-header {
      padding: 14px 18px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    /* ── Storage usage bar ── */
    .storage-usage {
      padding: 12px 18px 4px;
    }
    .storage-usage-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 5px;
    }
    .storage-usage-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .storage-usage-value {
      font-family: 'DM Mono', monospace;
      font-size: 9.5px;
      color: var(--muted);
    }
    .storage-usage-track {
      height: 5px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .storage-usage-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s, background-color 0.3s;
    }
    .storage-usage-fill.amber { background: #f3a93b; }
    .storage-usage-fill.red   { background: var(--danger); }
    .storage-usage-warning {
      margin-top: 8px;
      padding: 7px 9px;
      background: rgba(255, 95, 95, 0.10);
      border: 1px solid rgba(255, 95, 95, 0.30);
      border-radius: 5px;
      font-size: 10.5px;
      line-height: 1.35;
      color: var(--text);
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }
    .storage-usage-warning span { flex: 1; }
    .storage-usage-dismiss {
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      flex-shrink: 0;
    }
    .storage-usage-dismiss:hover { color: var(--text); }
    .list-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      flex: 1;
    }
    .list-actions { display: flex; align-items: center; gap: 6px; }

    .btn-export-zip {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--accent2);
      background: rgba(71,194,255,0.08);
      border: 1px solid rgba(71,194,255,0.25);
      cursor: pointer;
      padding: 3px 9px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn-export-zip:hover { background: rgba(71,194,255,0.16); border-color: rgba(71,194,255,0.5); }
    .btn-export-zip:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-export-zip svg { width: 10px; height: 10px; flex-shrink: 0; }

    .btn-clear-all {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .btn-clear-all:hover { color: var(--danger); background: rgba(255,95,95,0.08); }

    /* ── Items list ── */
    .items-list {
      padding: 0 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Paginator ── */
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 18px 14px;
      border-top: 1px solid var(--border);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
    }
    .pager-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 5px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .pager-btn:hover:not([disabled]) {
      color: var(--text);
      border-color: var(--text);
      background: rgba(255,255,255,0.04);
    }
    .pager-btn[disabled] {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .pager-info {
      color: var(--muted);
      flex-shrink: 0;
    }
    .pager-info .pager-current {
      color: var(--accent);
      font-weight: 700;
    }

    /* ── Empty state ── */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px 18px;
      color: var(--muted);
    }
    .empty-icon {
      width: 52px; height: 52px;
      border: 2px dashed var(--border);
      border-radius: 12px;
      display: grid;
      place-items: center;
      opacity: 0.5;
    }
    .empty-icon svg { width: 24px; height: 24px; }
    .empty-title { font-size: 13px; font-weight: 700; color: var(--muted); }
    .empty-sub   { font-size: 11px; font-family: 'DM Mono', monospace; text-align: center; line-height: 1.5; }

    /* ── Item card ── */
    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .item-card:hover { border-color: #3d4150; }

    .item-top {
      padding: 10px 12px 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .item-preview {
      width: 44px; height: 44px;
      background: #1e2028;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .item-preview-emoji {
      font-size: 22px;
      line-height: 1;
      filter: saturate(0.85);
    }

    /* Per-item size indicator: bytes label + mini share-of-quota bar.
       The mini-bar shares the same colour scale as the global storage
       bar so they read as the same kind of thing. */
    .item-size {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .item-size-label {
      font-family: 'DM Mono', monospace;
      font-size: 9.5px;
      color: var(--muted);
      flex-shrink: 0;
      min-width: 42px;
    }
    .item-size-track {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
    }
    .item-size-fill {
      height: 100%;
      background: var(--accent);
      transition: width 0.3s, background-color 0.3s;
    }
    .item-size-fill.amber { background: #f3a93b; }
    .item-size-fill.red   { background: var(--danger); }

    .item-meta { flex: 1; min-width: 0; }
    .item-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .item-title {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .item-url {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-path {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--accent2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
      opacity: 0.85;
      cursor: pointer;
      transition: opacity 0.15s, text-decoration-color 0.15s;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 2px;
    }
    .item-path:hover {
      opacity: 1;
      text-decoration-color: var(--accent2);
    }
    .item-time {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Item actions ── */
    .item-actions {
      border-top: 1px solid var(--border);
      display: flex;
    }
    .item-btn {
      flex: 1;
      padding: 8px 4px;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: color 0.15s, background 0.15s;
      border-right: 1px solid var(--border);
    }
    .item-btn:last-child { border-right: none; }
    .item-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
    .item-btn:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,0.04); }
    .item-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .item-btn.download-svg:hover { color: var(--accent); }
    .item-btn.download:hover     { color: var(--accent2); }
    .item-btn.view-avscout:hover { color: var(--accent); }
    .item-btn.open:hover         { color: var(--accent); }
    .item-btn.delete:hover       { color: var(--danger); }

    /* ── Storey badge ── */
    .storey-badge {
      font-size: 9px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      background: rgba(71,194,255,0.12);
      color: var(--accent2);
      border: 1px solid rgba(71,194,255,0.25);
      border-radius: 4px;
      padding: 1px 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 14px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #000;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100% - 28px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.has-action { pointer-events: all; padding: 5px 5px 5px 14px; }
    .toast.has-action span { overflow: hidden; text-overflow: ellipsis; }
    .toast-action {
      background: rgba(0,0,0,0.18);
      color: #000;
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 11px;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .toast-action:hover { background: rgba(0,0,0,0.3); }

    /* ── Confirm modal (in-popup, replaces window.confirm) ── */
    .cm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 200;
      padding: 16px;
    }
    .cm-overlay.open { opacity: 1; pointer-events: all; }
    .cm-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 16px 12px;
      width: 100%;
      max-width: 320px;
      transform: translateY(8px);
      transition: transform 0.15s;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
    }
    .cm-overlay.open .cm-modal { transform: translateY(0); }
    .cm-title {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--text);
    }
    .cm-body {
      font-size: 11.5px;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 14px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .cm-body strong {
      color: var(--text);
      font-weight: 600;
    }
    .cm-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .cm-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }
    .cm-btn-cancel {
      background: var(--border);
      color: var(--text);
    }
    .cm-btn-cancel:hover { background: #3a3d47; }
    .cm-btn-confirm {
      background: var(--accent);
      color: #000;
    }
    .cm-btn-confirm.danger {
      background: var(--danger);
      color: #fff;
    }
    .cm-btn-confirm:hover { opacity: 0.88; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 18 18" fill="none">
          <rect x="1" y="1" width="7" height="7" rx="1" stroke="#000" stroke-width="1.5"/>
          <rect x="10" y="1" width="7" height="7" rx="1" stroke="#000" stroke-width="1.5"/>
          <rect x="1" y="10" width="7" height="7" rx="1" stroke="#000" stroke-width="1.5"/>
          <rect x="10" y="10" width="3" height="7" rx="1" stroke="#000" stroke-width="1.5"/>
          <rect x="14" y="13" width="3" height="4" rx="1" fill="#000"/>
        </svg>
      </div>
      <div class="logo-text">Floor<span>Plan</span></div>
    </div>
    <div class="count-badge" id="countBadge">0 plans</div>
  </div>

  <!-- Capture -->
  <div class="capture-zone">
    <button class="btn-capture" id="btnCapture">
      <svg viewBox="0 0 15 15" fill="none">
        <circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.5"/>
        <line x1="7.5" y1="4.5" x2="7.5" y2="10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="4.5" y1="7.5" x2="10.5" y2="7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Capture #floorplan from Page
    </button>
    <div class="status-bar" id="statusBar"></div>
  </div>

  <!-- Storage usage bar — shown when at least one item is captured -->
  <div class="storage-usage" id="storageUsage" style="display:none">
    <div class="storage-usage-row">
      <span class="storage-usage-label">Extension storage</span>
      <span class="storage-usage-value" id="storageUsageValue">— / — MB · 0%</span>
    </div>
    <div class="storage-usage-track"><div class="storage-usage-fill" id="storageUsageFill"></div></div>
    <div class="storage-usage-warning" id="storageUsageWarning" style="display:none">
      <span>Storage is getting full. Send some captures to AVScout to free space.</span>
      <button class="storage-usage-dismiss" id="storageUsageDismiss" title="Dismiss until next session">×</button>
    </div>
  </div>

  <!-- List header -->
  <div class="list-header" id="listHeader" style="display:none">
    <span class="list-label">Captured Plans</span>
    <div class="list-actions">
      <button class="btn-export-zip" id="btnExportZip">
        <svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3">
          <path d="M5 1v6M2.5 4.5L5 7l2.5-2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M1.5 8.5h7" stroke-linecap="round"/>
        </svg>
        Export All ZIP
      </button>
      <button class="btn-clear-all" id="btnClearAll">clear all</button>
    </div>
  </div>

  <!-- Items list -->
  <div class="items-list" id="itemsList">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="8" height="8" rx="1"/>
          <rect x="13" y="3" width="8" height="8" rx="1"/>
          <rect x="3" y="13" width="8" height="8" rx="1"/>
          <rect x="13" y="13" width="8" height="8" rx="1"/>
        </svg>
      </div>
      <div class="empty-title">No floorplans yet</div>
      <div class="empty-sub">Navigate to a page with an<br/><code style="color:var(--accent2)">svg#svg-element</code> and capture it.</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- In-popup confirm modal (replaces window.confirm, which is unreadable in the 380px popup) -->
  <div class="cm-overlay" id="cmOverlay">
    <div class="cm-modal">
      <div class="cm-title" id="cmTitle"></div>
      <div class="cm-body" id="cmBody"></div>
      <div class="cm-actions">
        <button class="cm-btn cm-btn-cancel" id="cmCancelBtn">Cancel</button>
        <button class="cm-btn cm-btn-confirm" id="cmConfirmBtn">OK</button>
      </div>
    </div>
  </div>

  <!-- JSZip for zip export -->
  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
